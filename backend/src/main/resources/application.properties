spring.application.name=desafiospracticos

# Sin base de datos por ahora (MVP en memoria): se excluye la autoconfiguracion de
# JPA/DataSource para que la app levante sin una conexion real configurada.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Datasource (placeholder para cuando se sume persistencia)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=

# JPA (placeholder para cuando se sume persistencia)
spring.jpa.hibernate.ddl-auto=
spring.jpa.show-sql=

# Server
server.port=8080
