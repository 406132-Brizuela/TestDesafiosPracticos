# Fusionado del scaffolding (datasource/JPA) con la config de integración (rev 11).

spring:
  application:
    name: desafiospracticos-service
  datasource:
    url:
    username:
    password:
    driver-class-name:
  jpa:
    hibernate:
      ddl-auto:
    show-sql:
server:
  port: ${SERVER_PORT:8086}
management:
  server:
    port: ${MANAGEMENT_PORT:8087}   # convención: app+1 (DEC-28)
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false         # SOLO el gateway lleva true (único que resuelve lb://)
    healthcheck:
      enabled: true               # Eureka publica el readiness de Actuator, no el heartbeat
  instance:
    prefer-ip-address: true
app:
  api:
    public-path: /api/desafiospracticos/public
    private-path: /api/desafiospracticos
  client-id: ${APP_CLIENT_ID:desafiospracticos-service}
  client-secret: ${APP_CLIENT_SECRET:}
  gateway-url: ${GATEWAY_URL:http://api-gateway:8080}  # micro-a-micro: siempre el gateway
  # JWKS (job rev 11): claves PUBLICAS, bootstrap de infra — la UNICA llamada
  # que NO va por el gateway (excepcion documentada a R2, ver SPEC §7b).
  jwks-url: ${JWKS_URL:http://users-service:8082/.well-known/jwks.json}
  jwks-refresh-ms: ${JWKS_REFRESH_MS:300000}
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{requestId:-}]"
